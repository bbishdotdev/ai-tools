name: Release bstack

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'

      - name: Validate version and release notes
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 -B - <<'PY'
          import json
          import os
          from pathlib import Path
          import re

          version = json.loads(Path("bstack/package/selection.json").read_text())["version"]
          if not re.fullmatch(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", version):
              raise SystemExit("Release version must be a stable version such as 0.4.2")
          if os.environ["RELEASE_TAG"] != f"v{version}":
              raise SystemExit("Tag must exactly match the package version")
          notes = Path(f"bstack/release-notes/{version}.md")
          if not notes.is_file() or not notes.read_text().strip():
              raise SystemExit(f"Missing release notes: {notes}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={version}\n")
          PY

      - name: Check sources and generated package
        run: |
          python3 -B bstack/scripts/layers.py check
          python3 -B bstack/scripts/package.py check
          git diff --exit-code

      - name: Test package and installer
        run: |
          python3 -B bstack/scripts/test_layers.py
          python3 -B bstack/package/test_runtime.py
          python3 -B bstack/package/test_transport.py
          python3 -B bstack/scripts/test_package.py
          python3 -B -m unittest discover -s bstack/shared/tests

      - name: Build download
        run: python3 -B bstack/scripts/package.py dist --output .bstack/dist

      - name: Verify download checksum
        working-directory: .bstack/dist
        run: sha256sum --check SHA256SUMS

      - name: Upload and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          gh release create "$RELEASE_TAG" \
            ".bstack/dist/bstack-$RELEASE_VERSION.zip" \
            .bstack/dist/SHA256SUMS \
            --verify-tag --draft \
            --title "bstack $RELEASE_VERSION" \
            --notes-file "bstack/release-notes/$RELEASE_VERSION.md"
          gh release edit "$RELEASE_TAG" --draft=false
