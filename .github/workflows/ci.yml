name: BStack checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -B bstack/scripts/package.py check
      - run: python3 -B bstack/scripts/layers.py check
      - run: python3 -B bstack/scripts/test_package.py
      - run: python3 -B -m unittest discover -s bstack/shared/tests
      - run: python3 -B -m unittest discover -s bstack/github/tests
      - name: Check native Claude launch restrictions
        env:
          BSTACK_TEST_CLAUDE_NATIVE: '1'
          PYTHONPATH: bstack/github/tests
        run: |
          claude_test_prefix="$RUNNER_TEMP/bstack-claude-native"
          npm install --prefix "$claude_test_prefix" --ignore-scripts --no-audit --no-fund --package-lock=false --registry=https://registry.npmjs.org @anthropic-ai/claude-code-linux-x64@2.1.322
          export PATH="$claude_test_prefix/node_modules/@anthropic-ai/claude-code-linux-x64:$PATH"
          claude --version
          python3 -B -m unittest test_restricted_cli.RestrictedCLI.test_native_claude_preserves_auth_without_loading_user_customizations
