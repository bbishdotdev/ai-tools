<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 846" role="img" aria-labelledby="title description">
<title id="title">bstack tool compatibility</title>
<desc id="description">Status by tool across skills, automatic routing, PR workflows, and hooks. The CLI and desktop groups each include Codex, Claude Code, Cursor, and newer tool integrations.</desc>
<defs><g id="supported"><rect width="130" height="28" rx="7" fill="#16392f" stroke="#2f8066"/><circle cx="15" cy="14" r="5" fill="#70d6a8"/><text x="27" y="18" fill="#d9f9e8" font-size="12" font-weight="600">Supported</text></g>
