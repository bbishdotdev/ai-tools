<rect x="34" y="277" width="1051" height="49" rx="10" fill="#202831" stroke="#394754"/>
<g fill="#dce5ec" font-size="14" font-weight="600"><text x="55" y="307">Handoffs</text><text x="302" y="307">Architecture decisions</text><text x="654" y="307">Optional memory</text><text x="873" y="307">Local workspace</text></g>
